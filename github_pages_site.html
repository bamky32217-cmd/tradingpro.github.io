<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مدونتي</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 0;
    }
    header {
      background: #4a90e2;
      color: white;
      padding: 20px;
      text-align: center;
    }
    .container {
      max-width: 800px;
      margin: 20px auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h2 {
      margin-top: 0;
    }
    .post {
      margin-bottom: 25px;
    }
    footer {
      text-align: center;
      padding: 15px;
      color: #666;
    }
  </style>
</head>
<body>
  <header>
    <h1>أهلاً بك في موقعي</h1>
  </header>

  <div class="container">
    <div class="post">
      <h2>أول تدوينة</h2>
      <p>مرحباً! هذا مثال لتدوينة يمكنك تعديلها بما يناسبك.</p>
    </div>

    <div class="post">
      <h2>كيف أستخدم Monetag؟</h2>
      <p>يمكنك إضافة أكواد Monetag هنا لاحقاً بعد قبول موقعك.</p>
    </div>
  </div>

  <footer>
    © 2025 موقعك الشخصي
  </footer>
</body>
</html>
